<!DOCTYPE html>
<html lang="tr">
<head>
	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
		import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
		
		const firebaseConfig = {
			apiKey: "AIzaSyD0nYH-wuumIrz-PSb853jpBwaFRONQtfM",
			authDomain: "kongoru-fiyat-be5cb.firebaseapp.com",
			projectId: "kongoru-fiyat-be5cb",
			storageBucket: "kongoru-fiyat-be5cb.firebasestorage.app",
			messagingSenderId: "808489950269",
			appId: "1:808489950269:web:5832d352811b2bb8669e54"
		};
		const db = getDatabase(initializeApp(firebaseConfig));

		// Global fonksiyonlara atıyoruz ki aşağıda kullanalım
		window.saveCloudData = (key, data) => set(ref(db, key), data);
		window.getCloudData = async (key) => {
			const snap = await get(ref(db, key));
			return snap.exists() ? snap.val() : null;
		};
	</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONGORU - Servis Fiyat Listesi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2D3436;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        *, *:before, *:after { box-sizing: inherit; }
        .header-container { text-align: center; margin-bottom: 20px; }
        h2 { color: #40E0D0; margin: 0 0 5px 0; font-size: 26px; letter-spacing: 1px; cursor: default; user-select: none; }
        p { color: #b2bec3; font-size: 13px; margin: 0; }

        /* Arama & Hızlı Fiyat Paneli */
        .finder-panel {
            background-color: #1e2729;
            border: 2px solid #40E0D0;
            padding: 12px 20px;
            border-radius: 8px;
            max-width: 950px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(64, 224, 208, 0.15);
        }
        .finder-info { display: flex; flex-direction: column; gap: 3px; }
        .finder-info span { font-size: 11px; color: #b2bec3; font-weight: bold; text-transform: uppercase; }
        .finder-info strong { font-size: 14px; color: #74b9ff; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 11px; color: #b2bec3; font-weight: bold; }
        
        .admin-panel input, .search-box-input, .admin-panel select {
            padding: 8px; border: 1px solid #636e72; border-radius: 4px;

        .finder-result {
            font-size: 18px; font-weight: bold; color: #55efc4;
            background-color: rgba(85, 239, 196, 0.1); padding: 6px 15px;
            border-radius: 6px; border: 1px dashed #55efc4; min-width: 100px; text-align: center;
        }

        /* Yönetim Paneli */
        .admin-panel {
            background-color: #3b4244; padding: 15px; border-radius: 8px;
            max-width: 950px; margin: 0 auto 15px auto; display: flex;
            flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-top: 4px solid #40E0D0;
        }
        .admin-section-box {
            display: flex; gap: 10px; align-items: center;
            background: rgba(0,0,0,0.15); padding: 8px 12px; border-radius: 6px; border: 1px solid #636e72;
        }
        .btn {
            padding: 9px 15px; border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer; transition: background 0.3s; font-size: 13px;
        }
        .btn-add { background-color: #0984e3; color: white; }
        .btn-add:hover { background-color: #74b9ff; }
        .btn-save { background-color: #40E0D0; color: #2D3436; }
        .btn-save:hover { background-color: #2ec2b3; }
        .btn-mode { background-color: #e17055; color: white; }
        .btn-mode:hover { background-color: #fab1a0; }
        .btn-reset { background-color: #636e72; color: white; font-size: 11px; padding: 6px 10px; }

        /* Kategori Başlığı ve Akordeon Yapısı */
        .category-container { max-width: 950px; margin: 0 auto 20px auto; }
        .category-title {
            color: #74b9ff; font-size: 18px; margin-bottom: 10px; border-bottom: 2px solid #636e72;
            padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;
        }
        .category-actions { display: flex; gap: 6px; align-items: center; }
        
        .accordion-wrapper { display: flex; flex-direction: column; gap: 10px; }
        .accordion-card { background-color: #3b4244; border-radius: 8px; overflow: hidden; border: 1px solid #636e72; }

            background-color: #2d3436; color: #40E0D0; padding: 14px 18px;

        /* Ana Grup Grid Yapısı */

            background-color: #3b4244;

        }

        /* Ana Hizmet Grubu Kartı */
        .service-group-card {

        }

        /* Grup içindeki kalite satırları */
        .quality-row {
            background: rgba(255,255,255,0.03); padding: 8px; border-radius: 4px;
            display: flex; flex-direction: column; gap: 6px; border: 1px solid rgba(255,255,255,0.05);
        }
        .quality-row-header { display: flex; justify-content: space-between; align-items: center; }
        .quality-name { font-size: 12px; color: #eccc68; font-weight: bold; }

        .service-inputs { display: flex; gap: 6px; align-items: center; }
        .input-box-group { display: flex; flex-direction: column; gap: 2px; }

        .card-input {
            width: 65px; padding: 4px; border: 1px solid #636e72; border-radius: 4px;
            background-color: #2D3436; color: white; text-align: center; font-size: 11px;
        }
        .card-input:focus { outline: none; border-color: #40E0D0; }
        
        .final-price {
            font-size: 13px; font-weight: bold; color: #55efc4;

            flex: 1;
        }
        .final-price:hover { background-color: rgba(85, 239, 196, 0.2); }

        .order-btn { background: #636e72; border: none; color: white; cursor: pointer; font-size: 12px; padding: 3px 8px; border-radius: 3px; font-weight: bold; }
        .order-btn:hover { background: #b2bec3; color: #2d3436; }
        .delete-btn { background: none; border: none; color: #ff7675; cursor: pointer; font-size: 14px; font-weight: bold; padding: 0 4px; margin-left: 5px; }
        .delete-btn:hover { color: #d63031; }
        
        #statusMessage { text-align: center; color: #55efc4; margin-top: 15px; font-weight: bold; height: 20px; }

<body>

<div class="header-container">
    <h2 id="secretAdminTrigger" ondblclick="requestAdminAccess()">KONGORU SERVİS FİYAT LİSTESİ</h2>
    <p id="modeSubtitle">Kategorili Gruplandırılmış Mod - Hizmetler kaliteleriyle birlikte gruplar halinde listelenir.</p>

<!-- ARAMA VE ANLIK FİX PANELİ -->
<div class="finder-panel">
    <div class="control-group">
        <label>🔍 Hızlı Model Ara</label>
        <input type="text" id="globalSearchInput" class="search-box-input" placeholder="Örn: 8 Plus, S24..." oninput="filterBySearch()">

    <div class="finder-info">
        <span>Seçilen Cihaz:</span>

    <div class="finder-info">

        <strong id="selectedServiceText">Seçilmedi</strong>
    </div>
    <div class="control-group" style="align-items: center;">
        <span style="font-size: 11px; color: #b2bec3; font-weight: bold;">ANLIK FİYAT</span>

    <button class="btn btn-reset" onclick="clearSelection()">Sıfırla</button>

<!-- Yönetim Paneli -->
<div class="admin-panel" id="adminPanel">
    <div class="control-group">
        <label>Güncel Dolar Kuru ( ₺ )</label>
        <input type="number" id="dollarRate" step="0.01" placeholder="Örn: 36.00" oninput="calculateAllPrices()" style="width: 90px; text-align: center;">
    </div>
    <div class="admin-section-box">
        <div class="control-group">
            <label>Cihaz Sınıfı</label>
            <select id="newDeviceCategory" style="width: 100px;"></select>
        </div>
        <div class="control-group">
            <label>Cihaz Adı</label>
            <input type="text" id="newDeviceName" placeholder="Örn: iPhone 16" style="width: 100px;">
        </div>
        <div class="control-group" style="align-items: flex-end;">
            <label>&nbsp;</label>
            <button class="btn btn-add" onclick="addNewDevice()">+ Cihaz</button>
        </div>
    </div>
    <div class="admin-section-box">
        <div class="control-group">
            <label>Hangi Ana Grup?</label>
            <select id="targetServiceGroupSelect" style="width: 110px;"></select>
        </div>
        <div class="control-group">
            <label>Yeni Kalite / Alt İşlem</label>
            <input type="text" id="newQualityName" placeholder="Örn: Revize" style="width: 100px;">
        </div>
        <div class="control-group" style="align-items: flex-end;">
            <label>&nbsp;</label>
            <button class="btn btn-add" onclick="addNewQualityToSelectedGroup()" style="background-color: #00b894;">+ Kalite Ekle</button>
        </div>
    </div>
    <div class="admin-section-box">
        <div class="control-group">
            <label>Yeni Hizmet Ekle</label>
            <input type="text" id="newGroupName" placeholder="Örn: Flex İşlemleri" style="width: 110px;">
        </div>
        <div class="control-group" style="align-items: flex-end;">
            <label>&nbsp;</label>
            <button class="btn btn-add" onclick="addNewServiceGroup()" style="background-color: #6c5ce7;">+ Hizmet Ekle</button>
        </div>
    </div>
    <div class="admin-section-box">
        <div class="control-group">
            <label>Yeni Cihaz Sınıfı</label>
            <input type="text" id="newCategoryName" placeholder="Örn: Huawei" style="width: 100px;">
        </div>
        <div class="control-group" style="align-items: flex-end;">
            <label>&nbsp;</label>
            <button class="btn btn-add" onclick="addNewCategory()" style="background-color: #e17055;">+ Sınıf Ekle</button>
        </div>
    </div>
    <div class="control-group" style="align-items: flex-end;">
        <label>&nbsp;</label>
        <button class="btn btn-save" onclick="saveData()">Kaydet</button>
    </div>
    <div class="control-group" style="align-items: flex-end;">
        <label>&nbsp;</label>
        <button class="btn btn-mode" onclick="switchToCustomerMode()">Müşteri Moduna Geç</button>
    </div>
</div>

<!-- KATEGORİLİ AKORDEON ALANI -->
<div id="mainContentArea"></div>

<div id="statusMessage"></div>

<script>
    let defaultCategories = ['iPhone', 'iPad', 'Samsung', 'Xiaomi', 'Diğer'];
    
    let defaultServiceGroups = {
        "Ekran Değişimi": ["Orijinal", "Revize", "A Kalite", "B Kalite"],
        "Ön Cam - Dokunmatik": ["Orijinal", "A Kalite"],
        "Batarya Değişimi": ["Orijinal", "A Kalite Yükseltilmiş"],
        "Arka Kapak": ["Orijinal", "A Kalite"],
        "Soket İşlemleri": ["Sadece Soket", "Bordlu-Filmli Soket"],
        "Kamera Değişimi": ["Arka Kamera", "Ön Kamera"],
        "Diğer İşlemler": ["On Off Film Değişimi"]
    };

    let defaultDevices = [
        { name: "iPhone 8 Plus", category: "iPhone" },
        { name: "iPhone 8", category: "iPhone" },
        { name: "iPhone 7", category: "iPhone" }
    ];

    let isCustomerMode = true;
    let activeSelectedDevice = null;
    let activeSelectedKey = null;
    
    const adminPassword = "kongoru"; 

    function getCategories() {
        let stored = localStorage.getItem('kongoruGroupCatList');
        if (stored) { try { return JSON.parse(stored); } catch(e) {} }
        localStorage.setItem('kongoruGroupCatList', JSON.stringify(defaultCategories));
        return defaultCategories;
    }

    function getServiceGroups() {
        let stored = localStorage.getItem('kongoruServiceGroupsMap');
        if (stored) { try { return JSON.parse(stored); } catch(e) {} }
        localStorage.setItem('kongoruServiceGroupsMap', JSON.stringify(defaultServiceGroups));
        return defaultServiceGroups;
    }

    function getDevices() {
        let stored = localStorage.getItem('kongoruGroupDeviceList');
        if (stored) { try { return JSON.parse(stored); } catch(e) {} }
        localStorage.setItem('kongoruGroupDeviceList', JSON.stringify(defaultDevices));
        return defaultDevices;
    }

    function getPrices() {
        let saved = localStorage.getItem('kongoruGroupPrices');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return {};
    }

    function updateDropdowns() {
        const categories = getCategories();
        const catSelect = document.getElementById('newDeviceCategory');
        if(catSelect) {
            let html = '';
            categories.forEach(cat => { html += `<option value="${cat}">${cat}</option>`; });
            catSelect.innerHTML = html;
        }

        const serviceGroups = getServiceGroups();
        const groupSelect = document.getElementById('targetServiceGroupSelect');
        if(groupSelect) {
            let html = '';
            for (let gName in serviceGroups) {
                html += `<option value="${gName}">${gName}</option>`;
            }
            groupSelect.innerHTML = html;
        }
    }

    function renderContent() {
        const devices = getDevices();
        const serviceGroups = getServiceGroups();
        const savedData = getPrices();
        const allCats = getCategories();
        
        document.getElementById('dollarRate').value = savedData['dollarRate'] || 48.00;
        updateDropdowns();

        let categories = {};
        allCats.forEach(cat => { categories[cat] = []; });
        devices.forEach(item => {
            let cat = item.category || "Diğer";
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push(item);
        });

        let html = "";
        let catKeys = Object.keys(categories);
        
        catKeys.forEach((catName, catIndex) => {
            let orderBtns = '';
            if (!isCustomerMode) {
                let upBtn = catIndex > 0 ? `<button class="order-btn" onclick="moveCategory('${catName}', 'up')" title="Yukarı">▲</button>` : '';
                let downBtn = catIndex < catKeys.length - 1 ? `<button class="order-btn" onclick="moveCategory('${catName}', 'down')" title="Aşağı">▼</button>` : '';
                orderBtns = `<div class="category-actions">${upBtn}${downBtn}<button class="delete-btn admin-only" onclick="removeCategory('${catName}')">Sınıfı Sil ×</button></div>`;
            }

            html += `
            <div class="category-container" data-category-group="${catName}">
                <div class="category-title">
                    <span>📂 ${catName}</span>
                    ${orderBtns}
                </div>
                <div class="accordion-wrapper">`;

            if (categories[catName].length === 0) {
                html += `<div style="color: #636e72; font-size: 12px; padding: 5px 10px;">Bu sınıfta cihaz yok.</div>`;
            } else {
                categories[catName].forEach(item => {
                    const devId = item.name.replace(/\s+/g, '-').replace(/[^\w-]/g, '');

                    html += `
                    <div class="accordion-card" data-device-name="${item.name.toLowerCase()}">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            <span>📱 ${item.name}</span>
                            <div>
                                <span style="font-size: 12px; color: #b2bec3; margin-right: 10px;">Detay ▼</span>
                                ${!isCustomerMode ? `<button class="delete-btn admin-only" onclick="event.stopPropagation(); removeDevice('${item.name}')">×</button>` : ''}
                            </div>
                        </div>
                        <div class="accordion-body">`;

                    for (let groupName in serviceGroups) {
                        let qualities = serviceGroups[groupName];
                        
                        html += `
                            <div class="service-group-card">
                                <div class="service-group-title">
                                    <span>${groupName}</span>
                                    ${!isCustomerMode ? `<button class="delete-btn" style="font-size:11px;" onclick="removeGroup('${groupName}')" title="Hizmeti Sil">×</button>` : ''}
                                </div>`;

                        qualities.forEach(qName => {
                            let qKey = `${groupName}_${qName}`.replace(/\s+/g, '-').replace(/[^\w-]/g, '');
                            let uniqueInputId = `${devId}-${qKey}`;
                            let costVal = savedData[`${uniqueInputId}-cost`] || '';
                            let laborVal = savedData[`${uniqueInputId}-labor`] || '';
                            let qDeleteBtn = (!isCustomerMode) ? `<button class="delete-btn" style="font-size:10px;" onclick="removeQualityFromGroup('${groupName}', '${qName}')" title="Kaliteyi Sil">×</button>` : '';

                            html += `
                                <div class="quality-row">
                                    <div class="quality-row-header">
                                        <span class="quality-name">🔹 ${qName}</span>
                                        ${qDeleteBtn}
                                    </div>
                                    <div class="service-inputs">`;

                            if (!isCustomerMode) {
                                html += `
                                        <div class="input-box-group">
                                            <label>Maliyet ($)</label>
                                            <input type="number" step="0.5" class="card-input cost-input" id="${uniqueInputId}-cost" value="${costVal}" placeholder="$" oninput="calculateAllPrices()">
                                        </div>
                                        <div class="input-box-group">
                                            <label>İşçilik (₺)</label>
                                            <input type="number" class="card-input labor-input" id="${uniqueInputId}-labor" value="${laborVal}" placeholder="₺" oninput="calculateAllPrices()">
                                        </div>`;
                            }

                            html += `
                                        <div class="final-price" id="${uniqueInputId}-final" onclick="selectCell('${devId}', '${qKey}', '${item.name}', '${groupName} - ${qName}')">0 ₺</div>
                                    </div>
                                </div>`;
                        });

                        html += `</div>`; 
                    }

                    html += `</div></div>`; 
                });
            }

            html += `</div></div>`;
        });

        document.getElementById('mainContentArea').innerHTML = html;
        calculateAllPrices();
    }

    function toggleAccordion(headerEl) {
        headerEl.parentElement.classList.toggle('open');
    }

    function moveCategory(catName, direction) {
        saveDataSilent();
        let categories = getCategories();
        let index = categories.indexOf(catName);
        if (index === -1) return;

        if (direction === 'up' && index > 0) {
            let temp = categories[index - 1];
            categories[index - 1] = categories[index];
            categories[index] = temp;
        } else if (direction === 'down' && index < categories.length - 1) {
            let temp = categories[index + 1];
            categories[index + 1] = categories[index];
            categories[index] = temp;
        }

        localStorage.setItem('kongoruGroupCatList', JSON.stringify(categories));
        renderContent();
    }

    function filterBySearch() {
        let query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
        let catContainers = document.querySelectorAll('.category-container');
        
        catContainers.forEach(catDiv => {
            let cards = catDiv.querySelectorAll('.accordion-card');
            let hasVisibleCard = false;

            cards.forEach(card => {
                let name = card.getAttribute('data-device-name');
                if (name.includes(query) || query === '') {
                    card.style.display = '';
                    hasVisibleCard = true;
                } else {
                    card.style.display = 'none';
                }
            });

            if (hasVisibleCard || query === '') {
                catDiv.style.display = '';
            } else {
                catDiv.style.display = 'none';
            }
        });
    }

    function selectCell(devId, qKey, deviceName, serviceFullName) {
        activeSelectedDevice = devId;
        activeSelectedKey = qKey;
        document.getElementById('selectedDeviceText').innerText = deviceName;
        document.getElementById('selectedServiceText').innerText = serviceFullName;

        const target = document.getElementById(`${devId}-${qKey}-final`);
        if (target) {
            document.getElementById('finderResult').innerText = target.innerText;
            target.closest('.accordion-card').classList.add('open');
            target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function clearSelection() {
        activeSelectedDevice = null;
        activeSelectedKey = null;
        document.getElementById('selectedDeviceText').innerText = "Seçilmedi";
        document.getElementById('selectedServiceText').innerText = "Seçilmedi";
        document.getElementById('finderResult').innerText = "- ₺";
    }

	function calculateAllPrices() {
        let savedData = getPrices();
        let rate = parseFloat(document.getElementById('dollarRate')?.value) || parseFloat(savedData['dollarRate']) || 48.00;
        const devices = getDevices();
        const serviceGroups = getServiceGroups();

        devices.forEach((item) => {
            const devId = item.name.replace(/\s+/g, '-').replace(/[^\w-]/g, '');

            for (let groupName in serviceGroups) {
                serviceGroups[groupName].forEach(qName => {
                    let qKey = `${groupName}_${qName}`.replace(/\s+/g, '-').replace(/[^\w-]/g, '');
                    let uniqueInputId = `${devId}-${qKey}`;

                    let costInput = document.getElementById(`${uniqueInputId}-cost`);
                    let laborInput = document.getElementById(`${uniqueInputId}-labor`);
                    let finalCell = document.getElementById(`${uniqueInputId}-final`);

                    // Eğer inputlar ekrandaysa (Yönetici modu) oradan al, yoksa hafızadaki (localStorage) kayıtlı veriden al
                    let usdCost = costInput ? (parseFloat(costInput.value) || 0) : (parseFloat(savedData[`${uniqueInputId}-cost`]) || 0);
                    let customLabor = laborInput ? (parseFloat(laborInput.value) || 0) : (parseFloat(savedData[`${uniqueInputId}-labor`]) || 0);

                    if (finalCell) {
                        if (usdCost > 0 && rate > 0) {
                            let tlCost = usdCost * rate;
                            let rawTotal = tlCost + customLabor;
                            let withTax = rawTotal * 1.20;
                            let rounded = Math.ceil(withTax / 100) * 100;
                            finalCell.innerText = rounded.toLocaleString('tr-TR') + " ₺";
                        } else if (customLabor > 0 && usdCost === 0) {
                            let withTax = customLabor * 1.20;
                            let rounded = Math.ceil(withTax / 100) * 100;
                            finalCell.innerText = rounded.toLocaleString('tr-TR') + " ₺";
                        } else {
                            finalCell.innerText = "-";
                        }
                    }
                });
            }
        });

        if (activeSelectedDevice && activeSelectedKey) {
            let activeEl = document.getElementById(`${activeSelectedDevice}-${activeSelectedKey}-final`);
            if (activeEl) document.getElementById('finderResult').innerText = activeEl.innerText;
        }
    }

	async function switchToCustomerMode() {
	    isCustomerMode = true;
	    // Müşteri moduna geçmeden önce buluttan güncel fiyatları al
	    let cloudPrices = await window.getCloudData('prices');
	    if(cloudPrices) {
	        localStorage.setItem('kongoruGroupPrices', JSON.stringify(cloudPrices));
	    }
	    
	    renderContent();
	    document.getElementById('adminPanel').style.display = 'none';
	    document.getElementById('modeSubtitle').innerText = "KONGORU Müşteri Ekranı - Sadece güncel fiyatlar gruplar halinde listelenmektedir.";
	    clearSelection();
	}

    function requestAdminAccess() {
        let pass = prompt("Yönetici Şifresini Girin:");
        if (pass === adminPassword) {
            isCustomerMode = false;
            renderContent();
            document.getElementById('adminPanel').style.display = 'flex';
            document.getElementById('modeSubtitle').innerText = "Kategorili Gruplandırılmış Mod - Hizmetler kaliteleriyle birlikte gruplar halinde listelenir.";
            showStatus("Yönetim paneli açıldı!");
        } else if (pass !== null) {
            alert("Şifre yanlış!");
        }
    }

    function addNewDevice() {
        const inputField = document.getElementById('newDeviceName');
        const categorySelect = document.getElementById('newDeviceCategory');
        const deviceName = inputField.value.trim();
        const category = categorySelect.value;

        if(!deviceName) { alert("Cihaz adı yazın!"); return; }

        let devices = getDevices();
        if(devices.some(d => d.name.toLowerCase() === deviceName.toLowerCase())) { alert("Bu cihaz zaten var!"); return; }

        saveDataSilent();
        devices.unshift({ name: deviceName, category: category });
        localStorage.setItem('kongoruGroupDeviceList', JSON.stringify(devices));
        inputField.value = "";
        renderContent();
        showStatus("Cihaz eklendi!");
    }

    function removeDevice(deviceName) {
        if(confirm(`"${deviceName}" silinsin mi?`)) {
            saveDataSilent();
            let devices = getDevices().filter(d => d.name !== deviceName);
            localStorage.setItem('kongoruGroupDeviceList', JSON.stringify(devices));
            renderContent();
        }
    }

    function addNewServiceGroup() {
        const gInput = document.getElementById('newGroupName');
        let gName = gInput.value.trim();

        if(!gName) { alert("Hizmet adı yazın!"); return; }

        let groups = getServiceGroups();
        if (groups[gName]) { alert("Bu hizmet zaten var!"); return; }

        saveDataSilent();
        groups[gName] = [];
        localStorage.setItem('kongoruServiceGroupsMap', JSON.stringify(groups));
        gInput.value = "";
        renderContent();
        showStatus(`Yeni hizmet eklendi: ${gName}`);
    }

    function addNewCategory() {
        const cInput = document.getElementById('newCategoryName');
        let cName = cInput.value.trim();

        if(!cName) { alert("Sınıf adı yazın!"); return; }

        let cats = getCategories();
        if (cats.includes(cName)) { alert("Bu sınıf zaten var!"); return; }

        saveDataSilent();
        cats.push(cName);
        localStorage.setItem('kongoruGroupCatList', JSON.stringify(cats));
        cInput.value = "";
        renderContent();
        showStatus(`Yeni cihaz sınıfı eklendi: ${cName}`);
    }

    function removeCategory(catName) {
        if(confirm(`"${catName}" sınıfını ve altındaki cihazları silmek istiyor musunuz?`)) {
            saveDataSilent();
            let cats = getCategories().filter(c => c !== catName);
            localStorage.setItem('kongoruGroupCatList', JSON.stringify(cats));
            
            let devices = getDevices().filter(d => d.category !== catName);
            localStorage.setItem('kongoruGroupDeviceList', JSON.stringify(devices));
            
            renderContent();
            showStatus("Cihaz sınıfı silindi.");
        }
    }

    function addNewQualityToSelectedGroup() {
        const groupSelect = document.getElementById('targetServiceGroupSelect');
        const qInput = document.getElementById('newQualityName');
        let targetGroup = groupSelect.value;
        let qName = qInput.value.trim();

        if(!targetGroup || !qName) { alert("Lütfen hedef grubu seçin ve kalite adı yazın!"); return; }

        let groups = getServiceGroups();
        if(!groups[targetGroup]) groups[targetGroup] = [];

        if(!groups[targetGroup].includes(qName)) {
            groups[targetGroup].push(qName);
        } else {
            alert("Bu grupta bu kalite zaten var!"); return;
        }

        saveDataSilent();
        localStorage.setItem('kongoruServiceGroupsMap', JSON.stringify(groups));
        qInput.value = "";
        renderContent();
        showStatus(`"${targetGroup}" grubuna "${qName}" eklendi!`);
    }

    function removeGroup(groupName) {
        if(confirm(`"${groupName}" hizmetini ve altındaki tüm kaliteleri silmek istiyor musunuz?`)) {
            saveDataSilent();
            let groups = getServiceGroups();
            delete groups[groupName];
            localStorage.setItem('kongoruServiceGroupsMap', JSON.stringify(groups));
            renderContent();
            showStatus("Hizmet silindi.");
        }
    }

    function removeQualityFromGroup(groupName, qName) {
        if(confirm(`"${groupName}" altındaki "${qName}" silinsin mi?`)) {
            saveDataSilent();
            let groups = getServiceGroups();
            if(groups[groupName]) {
                groups[groupName] = groups[groupName].filter(q => q !== qName);
                if(groups[groupName].length === 0) delete groups[groupName];
            }
            localStorage.setItem('kongoruServiceGroupsMap', JSON.stringify(groups));
            renderContent();
            showStatus("Kalite silindi.");
        }
    }

    function saveDataSilent() {
        const dataToSave = {};
        const dollarInput = document.getElementById('dollarRate');
        dataToSave['dollarRate'] = dollarInput ? dollarInput.value : '48.00';
        document.querySelectorAll('.card-input').forEach(input => {
            dataToSave[input.id] = input.value;
        });
        localStorage.setItem('kongoruGroupPrices', JSON.stringify(dataToSave));
    }
    function showStatus(text) {
        const statusMsg = document.getElementById('statusMessage');
        statusMsg.innerText = text;
        setTimeout(() => { statusMsg.innerText = ""; }, 3000);
    }
	// Kaydetme fonksiyonunu buna çevir:
	async function saveData() {
			await window.saveCloudData('catList', getCategories());
			await window.saveCloudData('serviceGroups', getServiceGroups());
			await window.saveCloudData('deviceList', getDevices());
			
			const prices = {};
			document.querySelectorAll('.card-input').forEach(input => prices[input.id] = input.value);
			prices['dollarRate'] = document.getElementById('dollarRate').value;
			
			await window.saveCloudData('prices', prices);
			
			showStatus("Buluta kaydedildi!");
			
			// Kayıt bittikten hemen sonra ekranı yenilemeden sadece fiyatları hesapla
			calculateAllPrices();
		}

	// Yükleme fonksiyonunu (window.onload) buna çevir:
	window.onload = async () => {
		const cloudCats = await window.getCloudData('catList');
		if (cloudCats) localStorage.setItem('kongoruGroupCatList', JSON.stringify(cloudCats));
		
		const cloudGroups = await window.getCloudData('serviceGroups');
		if (cloudGroups) localStorage.setItem('kongoruServiceGroupsMap', JSON.stringify(cloudGroups));
		
		const cloudDevices = await window.getCloudData('deviceList');
		if (cloudDevices) localStorage.setItem('kongoruGroupDeviceList', JSON.stringify(cloudDevices));
		
		const cloudPrices = await window.getCloudData('prices');
		if (cloudPrices) localStorage.setItem('kongoruGroupPrices', JSON.stringify(cloudPrices));

		renderContent();
		// Sayfa yüklendiğinde admin panelini gizle
    document.getElementById('adminPanel').style.display = 'none';
	};

</script>
